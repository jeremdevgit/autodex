[package]
name = "autodex"
version = "0.1.0"
description = "Snap, identify and collect cars"
authors = ["jeremdevgit"]
license = "GPL-3.0-or-later"
repository = "https://github.com/jeremdevgit/autodex"
edition = "2021"
rust-version = "1.80"

[lib]
name = "autodex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.4"
